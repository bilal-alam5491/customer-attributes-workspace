<div class="channels-container">
  <table class="channels-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Channel</th>
        <th>Logo</th>
        <th>Media Routing Domain</th>
        <th>Interactive</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let channel of ccmChannels" 
          (click)="onChannelSelect(channel)" 
          style="cursor: pointer;">
        <td class="channel-id">{{channel.id}}</td>
        <td class="channel-name">{{channel.name}}</td>
        <td class="channel-logo">
          <img [src]="channel.channelLogo" [alt]="channel.name + ' logo'" *ngIf="channel.channelLogo"/>
        </td>
        <td class="channel-domain">{{channel.mediaRoutingDomain || 'N/A'}}</td>
        <td class="channel-interactive">
          <span class="interactive-badge" [class.is-interactive]="channel.isInteractive">
            {{channel.isInteractive ? 'Yes' : 'No'}}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
